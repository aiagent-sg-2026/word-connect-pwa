name: Release QA

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and deterministic tests
        run: npm test

      - name: Verify protected content integrity
        run: npm run content:verify

      - name: Install release browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Full campaign player simulation
        run: npm run e2e:full-player

      - name: PWA state-machine lifecycle
        run: npm run e2e:state-machine:run

      - name: Deterministic two-build Service Worker update
        env:
          SW_UPDATE_BROWSERS: chromium
        run: npm run e2e:sw-update

      - name: Production PWA smoke
        run: npm run smoke

      - name: Verify single-viewport mobile gameplay
        run: npm run layout:verify

      - name: Verify V1.1 gameplay integration in Chromium and WebKit
        run: npm run v1.1:verify

      - name: Verify V1.2 gameplay integration in Chromium and WebKit
        run: npm run v1.2:verify

      - name: Build and verify Human Golden Reviewer
        run: npm run reviewer:verify
